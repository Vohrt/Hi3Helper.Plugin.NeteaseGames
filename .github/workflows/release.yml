name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.0.1)'
        required: true
        default: '0.0.1'
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (NativeAOT)
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}'.TrimStart('v') }
          Write-Host "Publishing version $version"
          dotnet publish Hi3Helper.Plugin.NeteaseGames\Hi3Helper.Plugin.NeteaseGames.csproj `
            -c Release -r win-x64 `
            /p:PublishProfile=ReleasePublish-O2 `
            /p:Version=$version `
            /p:AssemblyVersion=$version `
            /p:FileVersion=$version

      - name: Build manifest and package
        shell: pwsh
        run: |
          $publish = 'Hi3Helper.Plugin.NeteaseGames\publish\Release'
          & '.\tools\Indexer.exe' $publish
          Get-ChildItem $publish | Select-Object Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          prerelease: ${{ github.event_name == 'push' || github.event.inputs.prerelease == 'true' }}
          files: |
            Hi3Helper.Plugin.NeteaseGames/publish/Release/*.zip
          fail_on_unmatched_files: true