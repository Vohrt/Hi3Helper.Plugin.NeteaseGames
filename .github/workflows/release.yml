name: Release

# Every game is published as its own plugin (own assembly + own zip), so a user only downloads the game they
# play. Add a new game by adding a preset project and one entry to the matrix below.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      game:
        description: 'Game plugin to build (SoR = Sea of Remnants, or "all")'
        required: true
        default: 'all'
      publish_profile:
        description: 'Publish profile (ReleasePublish-O2 = size, ReleasePublish-O6 = speed)'
        required: true
        default: 'ReleasePublish-O2'
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve games
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.set.outputs.games }}
    steps:
      - id: set
        shell: bash
        run: |
          # One entry per shipped game plugin. The key is the assembly name (= the short game id).
          ALL='[{"short":"SoR","project":"Hi3Helper.Plugin.SoR","name":"Sea of Remnants"}]'
          REQUESTED='${{ github.event.inputs.game }}'
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            echo "games=$ALL" >> "$GITHUB_OUTPUT"
          else
            FILTERED=$(echo "$ALL" | jq -c --arg s "$REQUESTED" '[.[] | select(.short == $s)]')
            if [ "$FILTERED" = "[]" ]; then
              echo "::error::Unknown game '$REQUESTED' (known: $(echo "$ALL" | jq -r '.[].short' | paste -sd, -))"
              exit 1
            fi
            echo "games=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.prepare.outputs.games) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A leftover publish directory from a previous run is how two versions of the same plugin ended up in
      # one release: the publish step appends to it and the upload glob picks both zips up.
      - name: Clean publish directory
        shell: pwsh
        run: |
          $publish = '${{ matrix.game.project }}\publish'
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          Write-Host "Publish directory is clean"

      # The test project is its own runner (Microsoft.Testing.Platform + xunit v3), so the test executable
      # runs the suite in process. `dotnet test` would go through a MSBuild named pipe and, on some hosts, the
      # classic vstest testhost; running the executable directly is simpler and always works.
      - name: Unit tests
        shell: pwsh
        run: |
          $project = 'Hi3Helper.NeteaseGames.Tests\Hi3Helper.NeteaseGames.Tests.csproj'
          dotnet build $project -c Release
          if ($LASTEXITCODE -ne 0) { throw "Building the tests failed with exit code $LASTEXITCODE" }

          $exe = Get-ChildItem 'Hi3Helper.NeteaseGames.Tests\bin\Release' -Recurse -Filter 'Hi3Helper.NeteaseGames.Tests.exe' |
                   Select-Object -First 1
          if (-not $exe) { throw "The test executable was not produced" }

          Write-Host "Running $($exe.FullName)"
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "The tests failed with exit code $LASTEXITCODE" }

      # NativeAOT needs the MSVC linker. windows-latest ships Visual Studio with the C++ workload, but
      # link.exe is not on PATH until vswhere's installation is added, so surface the toolchain first.
      - name: Prepare the native toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vsPath) {
              Write-Host "Visual Studio with C++ tools: $vsPath"
              Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:ProgramFiles "Microsoft Visual Studio\Installer")
            } else {
              Write-Host "::warning::No Visual Studio installation with the C++ workload was found"
            }
          } else {
            Write-Host "::warning::vswhere.exe was not found"
          }

      - name: Publish (NativeAOT)
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}'.TrimStart('v') }

          $profile = '${{ github.event.inputs.publish_profile }}'
          if ([string]::IsNullOrWhiteSpace($profile)) { $profile = 'ReleasePublish-O2' }

          $project = '${{ matrix.game.project }}\${{ matrix.game.project }}.csproj'
          Write-Host "Publishing $($project) version $version with $profile"

          $log = 'publish.log'
          dotnet publish $project `
            -c Release -r win-x64 `
            /p:PublishProfile=$profile `
            /p:Version=$version `
            /p:AssemblyVersion=$version `
            /p:FileVersion=$version `
            -v:n *>&1 | Tee-Object -FilePath $log | Out-Host
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            # Surface the interesting lines as annotations: the raw log is not downloadable without
            # authentication, so the failure has to be visible here.
            Write-Host "=== publish failed with exit code $code, first errors:"
            $errors = Select-String -Path $log -Pattern 'error |error:|LNK\d|link\.exe|MSB\d+|ILC' |
                        Select-Object -First 30
            foreach ($e in $errors) { Write-Host "::error::$($e.Line.Trim())" }
            Write-Host "=== last 40 lines:"
            Get-Content $log -Tail 40 | ForEach-Object { Write-Host $_ }
            throw "dotnet publish failed with exit code $code"
          }

      # A silent downgrade to a managed IL build (a few hundred KB) is a known AOT pitfall; the Indexer then
      # fails with "No valid plugin library was found.", but checking the size first gives a readable error.
      - name: Verify the native output
        shell: pwsh
        run: |
          $dir = '${{ matrix.game.project }}\publish\Release'
          $dll = Join-Path $dir '${{ matrix.game.short }}.dll'
          if (-not (Test-Path $dll)) { throw "The published library is missing: $dll" }

          $size = (Get-Item $dll).Length
          Write-Host "$($dll): $size bytes"
          if ($size -lt 2MB) { throw "The output looks like a managed build ($size bytes) - NativeAOT was downgraded" }

          $pdb = @(Get-ChildItem $dir -Filter *.pdb -ErrorAction SilentlyContinue)
          if ($pdb.Count -gt 0) { throw "The publish directory still contains symbols: $($pdb.Name -join ', ')" }

      - name: Build manifest and package
        shell: pwsh
        run: |
          $publish = '${{ matrix.game.project }}\publish\Release'
          & '.\tools\Indexer.exe' $publish
          if ($LASTEXITCODE -ne 0) { throw "Indexer failed with exit code $LASTEXITCODE" }

          $zips = @(Get-ChildItem $publish -Filter *.zip)
          if ($zips.Count -ne 1) { throw "Expected exactly one package, found $($zips.Count)" }
          Get-ChildItem $publish | Select-Object Name, Length

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.game.short }}
          path: |
            ${{ matrix.game.project }}/publish/Release/*.zip
            ${{ matrix.game.project }}/publish/Release/manifest.json
            ${{ matrix.game.project }}/publish/Release/${{ matrix.game.short }}.dll

  publish-release:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all plugin packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List packages
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          prerelease: ${{ github.event_name == 'push' || github.event.inputs.prerelease == 'true' }}
          # One zip per game (plus its manifest), so users download only the game they play.
          files: |
            artifacts/**/*.zip
            artifacts/**/manifest.json
          fail_on_unmatched_files: true

  publish-cdn:
    name: Publish auto-update files
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all plugin packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The plugin self updater pulls <cdn>/<SHORT>/manifest.json + <SHORT>/<SHORT>.dll, one directory per game.
      - name: Push to the release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=== downloaded artifacts ==="
          find artifacts -type f | sort

          # Start from the current release branch so the other games' directories survive.
          if git fetch origin release 2>/dev/null && git rev-parse --verify --quiet origin/release >/dev/null; then
            echo "=== updating the existing release branch"
            git checkout -B release origin/release
          else
            echo "=== creating the release branch"
            git checkout --orphan release
            git rm -rf . >/dev/null 2>&1 || true
          fi

          for dir in artifacts/plugin-*; do
            short="${dir#artifacts/plugin-}"
            echo "=== staging $short from $dir"
            mkdir -p "$short"
            cp "$dir/manifest.json" "$short/manifest.json"
            cp "$dir/$short.dll" "$short/$short.dll"
          done

          # The downloaded artifacts are build inputs, not branch content: only the per-game directories are
          # staged (an unconditional `git add -A` would also pick up whatever the checkout left behind).
          for dir in artifacts/plugin-*; do
            short="${dir#artifacts/plugin-}"
            git add --force -- "$short"
          done

          echo "=== staged"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Publish auto-update files"
          fi
          git push origin HEAD:release --force
